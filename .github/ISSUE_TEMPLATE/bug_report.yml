name: Bug report
description: Graft did something wrong, or failed without a clear reason.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps. A public repo or a graft.md that shows it helps most.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The failing command's output with `--json`, and `.grafts/.report/sync.md` if sync was involved.
      render: text
  - type: input
    id: graft-version
    attributes:
      label: Graft version
      placeholder: '@graftsync/cli 0.2.1, or the Action at main@<sha>'
    validations:
      required: true
  - type: dropdown
    id: mechanism
    attributes:
      label: Mechanism
      options:
        - patch
        - fork
        - fork (repo mode)
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Package manager, Node and OS
      placeholder: pnpm 10.28.0, Node 24.15.0, macOS 26
    validations:
      required: true
