# Versions and publishes the @graftsync/* packages with Changesets.
# Manual only: run it from the Actions tab (or `gh workflow run release.yml`) on main.
# If changesets are pending, it opens (or updates) a "Version packages" PR; otherwise it
# publishes any package version not yet on npm, then tags the release once (v<version>: the
# @graftsync/* packages share one version) and creates its GitHub release.
#
# Requires: the `graftsync` npm org, and an NPM_TOKEN repository secret that can publish to it.
# Without NPM_TOKEN, the release step is skipped.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Skip release (NPM_TOKEN not set)
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; skipping version PR and publish."
      - uses: changesets/action@v1
        id: changesets
        if: env.NPM_TOKEN != ''
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # One tag and one GitHub release per release, not one per package. With no changesets
      # pending, the action ran `pnpm release`, which either published this version (or found it
      # already published) or failed the job, so the version is on npm, or is being staged there
      # (npm stages new publishes for minutes). Tag it then; re-running Release backfills a tag.
      # (The action's `published` output can't be used: it parses `changeset publish`'s tag lines,
      # which --no-git-tag turns off.)
      - name: Tag and release
        if: env.NPM_TOKEN != '' && steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          # Release notes: the CLI changelog's section for this version, else GitHub's generated notes.
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            let text = "";
            try { text = fs.readFileSync("packages/cli/CHANGELOG.md", "utf8"); } catch {}
            const m = text.split(/^## /m).find((s) => s.startsWith(v + "\n"));
            fs.writeFileSync("release-notes.md", m ? m.slice(v.length).trim() + "\n" : "");
          ' "$version"
          if [ -s release-notes.md ]; then
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
