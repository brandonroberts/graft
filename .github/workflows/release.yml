# Versions and publishes the @graftsync/* packages with Changesets.
# Manual only: run it from the Actions tab (or `gh workflow run release.yml`) on main.
# If changesets are pending, it opens (or updates) a "Version packages" PR; otherwise it
# publishes any package version not yet on npm.
#
# Requires: the `graftsync` npm org, and an NPM_TOKEN repository secret that can publish to it.
# Without NPM_TOKEN, the release step is skipped.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Skip release (NPM_TOKEN not set)
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; skipping version PR and publish."
      - uses: changesets/action@v1
        if: env.NPM_TOKEN != ''
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
