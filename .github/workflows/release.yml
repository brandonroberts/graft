# Versions and publishes the @graftsync/* packages with Changesets.
# On push to main: if changesets are pending, opens (or updates) a "Version packages" PR;
# otherwise publishes any package version not yet on npm, with provenance.
#
# Requires: the `graftsync` npm org, and an NPM_TOKEN repository secret that can publish to it.
# Until NPM_TOKEN is set, the release step is skipped.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Skip release (NPM_TOKEN not set)
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; skipping version PR and publish."
      - uses: changesets/action@v1
        if: env.NPM_TOKEN != ''
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
