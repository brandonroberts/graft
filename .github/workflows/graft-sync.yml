# Dogfood: keep this repo's grafts (pacote, semver, yaml → native ESM) in sync with upstream.
# Opens a PR when a new upstream version passes every graft's oracle, and an issue or draft PR
# when a graft needs an agent or a human.
#
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Graft sync

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency: graft-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: ./packages/action
        with:
          # Built in place in this monorepo; consumers use the default `npx --no-install graft`.
          graft-command: node packages/cli/dist/bin.js
          mcp-command: node packages/mcp/dist/bin.js
          install-command: pnpm install --frozen-lockfile
          # To hand failing grafts to an agent, set agent-command (see packages/action/README.md).
