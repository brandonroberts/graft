name: Graft sync
description: Keep local modifications to upstream packages (npm, Cargo, Go, PyPI) in sync. Checks the installed grafts, polls for new releases, re-verifies grafts, opens PRs, and hands failures to your agent.
author: Graft
branding:
  icon: git-merge
  color: green

inputs:
  github-token:
    description: >
      Token used by `gh` to open pull requests and issues. Needs contents, pull-requests and issues write.
      A GitHub App token (or fine-grained PAT) lets the action open PRs where Actions may not, and its
      PRs trigger your CI. If PRs are refused, the action opens an issue with a link to open the PR instead.
    default: ${{ github.token }}
  working-directory:
    description: Project root (the directory containing .grafts/).
    default: .
  graft-command:
    description: How to run the graft CLI in the project.
    default: npx --no-install graft
  tags:
    description: Comma-separated npm dist-tags to consider (default latest,next,rc,beta; prereleases preferred). Cargo, Go and PyPI packages report latest (newest release) and next (newest prerelease).
    default: ''
  packages:
    description: Comma-separated rootstock packages to consider (default all). Name a package outside npm as ecosystem:name (e.g. cargo:itoa) to tell it from an npm package of the same name.
    default: ''
  agent-command:
    description: >
      Shell command that runs your coding agent when grafts need one (sync exit 1). It receives
      GRAFT_PROMPT_FILE, GRAFT_SKILL_PATH, GRAFT_COMMAND, GRAFT_REPORT_JSON, GRAFT_REPORT_MD,
      GRAFT_PR_BODY_FILE, GRAFT_PACKAGE, GRAFT_ECOSYSTEM, GRAFT_TARGET_VERSION and GRAFT_BRANCH. The action re-runs
      graft sync afterwards; the agent's word is never trusted. Empty: no agent.
    default: ''
  on-needs-agent:
    description: >
      What to do when grafts still need attention (after the agent, if any). "report": open a draft PR
      if there are changes to propose, otherwise an issue with the sync report (once per package@version).
      "skip": only record it in the job summary.
    default: report
  install-command:
    description: >
      Reinstall command used to reset node_modules between npm packages (default detected from the lockfile).
      Other ecosystems reset themselves - Cargo and Go need nothing, PyPI runs uv sync --locked, poetry install
      or pip install -r requirements.txt.
    default: ''
  base-branch:
    description: Branch to open PRs against (default the checked-out branch).
    default: ''
  branch-prefix:
    description: Prefix for sync branches.
    default: graft/sync-
  labels:
    description: Comma-separated labels to add to PRs (they must already exist).
    default: ''
  commit-author:
    description: Commit author, as "Name <email>".
    default: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
  skill-path:
    description: Path to the graft-sync SKILL.md handed to the agent (default the copy shipped with this action).
    default: ''
  dry-run:
    description: Run sync but do not push or open PRs.
    default: 'false'
  check:
    description: >
      Run `graft check` on the installed tree first (before any branch is touched): every active
      graft's package-manager configuration, anchors, and installed files (= pristine upstream +
      the selected variant). "fail" fails the job when a graft is not applied (after the sync
      work), "warn" only annotates, "off" skips it.
    default: fail
  sync:
    description: >
      Look for newer upstream versions and open PRs/issues. Set to false to only run the check,
      e.g. in ordinary CI right after installing dependencies.
    default: 'true'

outputs:
  check:
    description: JSON result of graft check (ok, per-graft reports and failures), or null when check is off.
    value: ${{ steps.graft.outputs.check }}
  results:
    description: JSON array with one entry per rootstock package (outcome, versions, PR URL, reasons).
    value: ${{ steps.graft.outputs.results }}
  pull-requests:
    description: JSON array of opened PR URLs.
    value: ${{ steps.graft.outputs.pull-requests }}

runs:
  using: composite
  steps:
    - id: graft
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRAFT_INPUTS: ${{ toJSON(inputs) }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/run.mjs"
